name: Close issues merged into staging

on:
  pull_request:
    types: [closed]
    branches:
      - staging

permissions:
  contents: read
  issues: write

jobs:
  close-issues:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Close referenced issues
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.pull_request.body || "";

            const closingReference =
              /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)\b/gi;

            const issueNumbers = new Set(
              [...body.matchAll(closingReference)].map(match =>
                Number(match[1])
              )
            );

            for (const issue_number of issueNumbers) {
              const { data: item } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number
              });

              // A API trata PRs como issues; não fechamos uma PR por engano.
              if (item.pull_request) {
                core.warning(`#${issue_number} é uma pull request; ignorando.`);
                continue;
              }

              if (item.state === "open") {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  state: "closed",
                  state_reason: "completed"
                });

                core.info(`Issue #${issue_number} fechada.`);
              }
            }